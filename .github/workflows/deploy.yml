name: deploy

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "README.md"
      - ".gitignore"
    branches:
      - main
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "production"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

permissions: {}

# set an environment variable for use in the jobs pointing to my site
env:
  web_url: https://blog.birki.io/

cache-mode: none

jobs:
  deployment-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs: # set outputs for use in downstream jobs
      continue: ${{ steps.deployment-check.outputs.continue }}

    steps:
      # https://github.com/github/branch-deploy/blob/d3c24bd92505e623615b75ffdfac5ed5259adbdb/docs/merge-commit-strategy.md
      - name: deployment check
        uses: grantbirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # pin@v12.1.0
        id: deployment-check
        with:
          merge_deploy_mode: "true"
          environment: production

  build:
    if: ${{ needs.deployment-check.outputs.continue == 'true' }}
    needs: deployment-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}

    steps:
      - name: validate selected revisions
        env:
          TRUSTED_SHA: ${{ github.sha }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: checkout trusted tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: checkout selected content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: build with verified Hugo
        id: site
        env:
          TRUSTED_SHA: ${{ github.sha }}
          SELECTED_SHA: ${{ github.sha }}
          BASE_URL: ${{ env.web_url }}
        run: python3 trusted/script/ci/build_site.py

      - name: upload artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ steps.site.outputs.path }}
          if-no-files-found: error

  deploy:
    if: ${{ needs.deployment-check.outputs.continue == 'true' }}
    needs: [ deployment-check, build ]
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: production
      url: ${{ env.web_url }}

    steps:
      - name: download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ./public

      - name: deploy
        id: deployment
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # pin@v3.15.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '3.9.0'
          command: pages deploy public/ --project-name=blog-birki-io --branch=main
