name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: validate selected revisions
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: checkout trusted tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: checkout selected content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        with:
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: test build helper
        run: python3 candidate/script/ci/test_build_site.py

      - name: build with verified Hugo
        id: site
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          SELECTED_SHA: ${{ github.sha }}
          BASE_URL: ''
        run: python3 candidate/script/ci/build_site.py
