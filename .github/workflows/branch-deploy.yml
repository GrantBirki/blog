name: branch deploy

# The workflow to execute on is comments that are newly created
on:
  issue_comment:
    types: [ created ]

permissions: {}

# set an environment variable for use in the jobs pointing to my site
env:
  web_url: https://blog.birki.io/

jobs:
  # branch-deploy trigger job
  trigger:
    if: # only run on pull request comments and very specific comment body string as defined in our branch-deploy settings
      ${{ github.event.issue.pull_request &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '.deploy') ||
      contains(github.event.comment.body, '.lock') ||
      contains(github.event.comment.body, '.noop') ||
      contains(github.event.comment.body, '.help') ||
      contains(github.event.comment.body, '.wcid') ||
      contains(github.event.comment.body, '.unlock')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
      checks: read
      statuses: read
    outputs: # set outputs for use in downstream jobs
      context: ${{ steps.branch-deploy.outputs.context }}
      continue: ${{ steps.branch-deploy.outputs.continue }}
      noop: ${{ steps.branch-deploy.outputs.noop }}
      deployment_id: ${{ steps.branch-deploy.outputs.deployment_id }}
      environment: ${{ steps.branch-deploy.outputs.environment }}
      ref: ${{ steps.branch-deploy.outputs.ref }}
      sha: ${{ steps.branch-deploy.outputs.sha }}
      comment_id: ${{ steps.branch-deploy.outputs.comment_id }}
      initial_reaction_id: ${{ steps.branch-deploy.outputs.initial_reaction_id }}
      actor_handle: ${{ steps.branch-deploy.outputs.actor_handle }}

    steps:
      # execute the branch-deploy action
      - uses: grantbirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # pin@v12.1.0
        id: branch-deploy
        with:
          trigger: ".deploy"
          sticky_locks: "true" # optional see -> https://github.com/github/branch-deploy/blob/main/docs/hubot-style-deployment-locks.md
          environment_targets: production
          skip_completing: "true" # we will complete the deployment manually in the 'result' job
          admins: "GrantBirki"

  build:
    needs: trigger
    if: ${{ needs.trigger.outputs.continue == 'true' && fromJSON(needs.trigger.outputs.context).run_attempt == github.run_attempt }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}

    steps:
      - name: validate selected revisions
        env:
          TRUSTED_SHA: ${{ github.sha }}
          SELECTED_SHA: ${{ needs.trigger.outputs.sha }}
        run: |
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: checkout trusted tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: checkout selected content
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        with:
          ref: ${{ needs.trigger.outputs.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: build with verified Hugo
        id: site
        env:
          TRUSTED_SHA: ${{ github.sha }}
          SELECTED_SHA: ${{ needs.trigger.outputs.sha }}
          BASE_URL: ${{ env.web_url }}
        run: python3 trusted/script/ci/build_site.py

      - name: upload artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.trigger.outputs.sha }}
          path: ${{ steps.site.outputs.path }}
          if-no-files-found: error

  deploy:
    needs: [ trigger, build ]
    if: ${{ needs.trigger.outputs.continue == 'true' && fromJSON(needs.trigger.outputs.context).run_attempt == github.run_attempt }}
    runs-on: ubuntu-latest
    permissions: {}
    environment:
      name: production
      deployment: false

    steps:
      - name: complete build-only noop
        if: ${{ needs.trigger.outputs.noop == 'true' }}
        run: echo "Noop build completed; publication is skipped."

      - name: download built site
        if: ${{ needs.trigger.outputs.noop != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ./public

      - name: deploy
        if: ${{ needs.trigger.outputs.noop != 'true' }}
        id: deployment
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # pin@v3.15.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '3.9.0'
          command: pages deploy public/ --project-name=blog-birki-io --branch=main

  result:
    needs: [ trigger, build, deploy ]
    if: ${{ always() && needs.trigger.outputs.continue == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - name: report result
        uses: grantbirki/branch-deploy@a7a7ea40a15a79a036322c2924ab74f5eded702c # pin@v12.1.0
        with:
          result_mode: true
          context: ${{ needs.trigger.outputs.context }}
          job_results: ${{ toJSON(needs.*.result) }}
          result_url: ${{ env.web_url }}
